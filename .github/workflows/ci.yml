name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI checks
        run: pnpm run ci:check

      - name: Run tests
        run: pnpm run test:ci

      - name: Build Node/Vercel target
        run: pnpm run build:node
        env:
          OPENSEO_RUNTIME: node
          DATABASE_PROVIDER: postgres
          DATABASE_URL: postgresql://build-only.invalid/openseo

      - name: Install website dependencies
        run: pnpm --dir web install --frozen-lockfile

      - name: Run website type checks
        run: pnpm --dir web run types:check

      - name: Build website
        run: pnpm --dir web run build

  postgres-migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: openseo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d openseo"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/openseo

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply Postgres migrations
        run: pnpm run db:migrate:pg

      - name: Verify migrated schema
        run: |
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const sql = postgres(process.env.POSTGRES_DATABASE_URL, { max: 1 });
          try {
            const [{ count }] = await sql`
              select count(*)::int as count
              from drizzle.__drizzle_migrations
            `;
            if (count !== 21) {
              throw new Error(`Expected 21 Drizzle migrations, found ${count}`);
            }

            const expectedTables = [
              "projects",
              "gsc_connections",
              "ga4_connections",
              "audits",
              "rank_tracking_configs",
              "user",
              "organization",
            ];
            for (const table of expectedTables) {
              const [{ relation }] = await sql`
                select to_regclass(${`public.${table}`})::text as relation
              `;
              if (!relation) {
                throw new Error(`Expected migrated table public.${table}`);
              }
            }
          } finally {
            await sql.end();
          }
          NODE

      - name: Build Neon bootstrap SQL
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d openseo \
            --schema-only \
            --no-owner \
            --no-privileges \
            > open-seo-neon-bootstrap.sql
          docker exec "$POSTGRES_CONTAINER" pg_dump -U postgres -d openseo \
            --data-only \
            --inserts \
            --column-inserts \
            --table='drizzle.__drizzle_migrations' \
            --no-owner \
            --no-privileges \
            >> open-seo-neon-bootstrap.sql

      - name: Verify bootstrap SQL restores cleanly
        run: |
          set -euo pipefail
          POSTGRES_CONTAINER="$(docker ps --filter ancestor=postgres:17 --format '{{.ID}}' | head -n1)"
          test -n "$POSTGRES_CONTAINER"
          docker exec "$POSTGRES_CONTAINER" createdb -U postgres openseo_bootstrap
          docker exec -i "$POSTGRES_CONTAINER" psql -U postgres -d openseo_bootstrap \
            -v ON_ERROR_STOP=1 \
            < open-seo-neon-bootstrap.sql
          BOOTSTRAP_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/openseo_bootstrap \
          node --input-type=module <<'NODE'
          import postgres from "postgres";

          const sql = postgres(process.env.BOOTSTRAP_DATABASE_URL, { max: 1 });
          try {
            const [{ count }] = await sql`
              select count(*)::int as count
              from drizzle.__drizzle_migrations
            `;
            if (count !== 21) {
              throw new Error(`Bootstrap expected 21 Drizzle migrations, found ${count}`);
            }

            const expectedTables = [
              "projects",
              "gsc_connections",
              "ga4_connections",
              "audits",
              "rank_tracking_configs",
              "user",
              "organization",
            ];
            for (const table of expectedTables) {
              const [{ relation }] = await sql`
                select to_regclass(${`public.${table}`})::text as relation
              `;
              if (!relation) {
                throw new Error(`Bootstrap expected public.${table}`);
              }
            }
          } finally {
            await sql.end();
          }
          NODE

      - name: Upload verified Neon bootstrap SQL
        uses: actions/upload-artifact@v4
        with:
          name: open-seo-neon-bootstrap
          path: open-seo-neon-bootstrap.sql
          if-no-files-found: error
          retention-days: 1

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build self-host Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.selfhost
          push: false
          load: false
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
