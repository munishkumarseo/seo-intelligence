name: Task 5 Route Tree Probe

on:
  push:
    branches:
      - feat/task5-search-opportunities-api

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task5-search-opportunities-api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate route tree
        run: pnpm vite build
      - name: Commit generated routing source
        run: |
          if git diff --quiet -- src/routeTree.gen.ts src/routes; then
            echo "Generated routing source is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/routeTree.gen.ts src/routes
          git commit -m "chore: regenerate TanStack route tree"
          git push origin HEAD:feat/task5-search-opportunities-api
