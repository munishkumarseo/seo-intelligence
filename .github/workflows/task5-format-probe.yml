name: Task 5 Format Probe

on:
  push:
    branches:
      - feat/task5-search-opportunities-api

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/task5-search-opportunities-api
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format package manifest
        run: pnpm prettier package.json --write
      - name: Commit canonical formatting
        run: |
          if git diff --quiet -- package.json; then
            echo "package.json is already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "style: format CI manifest change"
          git push origin HEAD:feat/task5-search-opportunities-api
