name: Generate Nitro Lock

on:
  pull_request:

permissions:
  contents: write

jobs:
  generate:
    if: github.head_ref == 'arch/vercel-neon-runtime'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: arch/vercel-neon-runtime

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Add reproducible Node build dependency and script
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const path = "package.json";
          const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
          pkg.scripts["build:node"] = "OPENSEO_RUNTIME=node vite build && tsc --noEmit";
          pkg.devDependencies.nitro = "3.0.260610-beta";
          fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`);
          NODE
          pnpm install --lockfile-only

      - name: Commit generated dependency files
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "build: add Nitro Node target dependency"
          git push origin HEAD:arch/vercel-neon-runtime
